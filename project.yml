# XcodeGen spec — regenerate with: xcodegen generate
# Standalone, sandboxed tmux cheatsheet. App Store-eligible (no tmux control,
# no Accessibility, no external processes). Fully independent of mac-tmux-kit.
name: TmuxCheatsheet
options:
  bundleIdPrefix: com.gakalone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sandboxed → eligible for the Mac App Store. Local dev builds sign ad-hoc.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: YES

targets:
  TmuxCheatsheet:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tmux Cheatsheet
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gakalone.TmuxCheatsheet
        PRODUCT_NAME: TmuxCheatsheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  TmuxCheatsheet:
    build:
      targets:
        TmuxCheatsheet: all
    run:
      config: Debug
